<!-- TAB: WEBHOOKS & NOTIFICACIONES (Dockraft Multi-Channel Style) -->
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
  <h2 style="font-size: 1.3rem; font-weight: 700; color: #f1f5f9; margin: 0; display: flex; align-items: center; gap: 8px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span>Centro de Notificaciones &amp; Webhooks</span>
  </h2>
  <button type="button" class="btn btn-primary" id="btn-open-webhooks-channels" onclick="Webhooks.openChannelsModal()" style="display: inline-flex; align-items: center; gap: 6px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Configurar Webhooks</span>
  </button>
</div>

<!-- Modal: Canales de Notificación (Discord, Telegram, Email) -->
<div class="modal-backdrop" id="webhooks-channels-modal">
  <div class="modal-box" style="max-width: 940px;">
    <div class="modal-header">
      <h3 style="display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Canales de Notificación</span>
      </h3>
      <button class="action-icon-btn" onclick="Webhooks.closeChannelsModal()" aria-label="Cerrar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;">

        <!-- Discord -->
        <div class="card webhook-card" style="border-top: 3px solid #5865f2; display: flex; flex-direction: column; justify-content: space-between; margin: 0;">
          <div>
            <div class="webhook-channel-header" style="margin-bottom: 14px; padding-bottom: 10px;">
              <div class="webhook-channel-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5865f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="8" cy="12" r="1.5" fill="#5865f2"/><circle cx="16" cy="12" r="1.5" fill="#5865f2"/></svg>
                <span>Discord</span>
                <span class="webhook-channel-badge badge-discord">Embeds</span>
              </div>
              <label class="toggle-switch">
                <input type="checkbox" id="webhook-discord-enable" onchange="Webhooks.toggleChannel('discord', this.checked)">
                <span class="slider"></span>
              </label>
            </div>
            <div class="webhook-status-badge" id="webhook-discord-status">
              <span class="status-dot"></span> <span id="webhook-discord-status-text">Sin configurar</span>
            </div>
          </div>
          <div style="display: flex; gap: 8px; margin-top: 18px;">
            <button type="button" class="btn btn-primary" onclick="Webhooks.openModal('discord')" style="flex: 1; font-size: 0.82rem; padding: 7px 12px;">Configurar</button>
            <button type="button" class="btn btn-outline" id="btn-test-discord" onclick="Webhooks.testChannel('discord')" style="font-size: 0.82rem; padding: 7px 14px; border-color: rgba(88, 101, 242, 0.4); color: #7289da;">Probar</button>
          </div>
        </div>

        <!-- Telegram -->
        <div class="card webhook-card" style="border-top: 3px solid #229ed9; display: flex; flex-direction: column; justify-content: space-between; margin: 0;">
          <div>
            <div class="webhook-channel-header" style="margin-bottom: 14px; padding-bottom: 10px;">
              <div class="webhook-channel-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#229ed9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                <span>Telegram</span>
                <span class="webhook-channel-badge badge-telegram">Bot API</span>
              </div>
              <label class="toggle-switch">
                <input type="checkbox" id="webhook-telegram-enable" onchange="Webhooks.toggleChannel('telegram', this.checked)">
                <span class="slider"></span>
              </label>
            </div>
            <div class="webhook-status-badge" id="webhook-telegram-status">
              <span class="status-dot"></span> <span id="webhook-telegram-status-text">Sin configurar</span>
            </div>
          </div>
          <div style="display: flex; gap: 8px; margin-top: 18px;">
            <button type="button" class="btn btn-primary" onclick="Webhooks.openModal('telegram')" style="flex: 1; font-size: 0.82rem; padding: 7px 12px;">Configurar</button>
            <button type="button" class="btn btn-outline" id="btn-test-telegram" onclick="Webhooks.testChannel('telegram')" style="font-size: 0.82rem; padding: 7px 14px; border-color: rgba(34, 158, 217, 0.4); color: #38bdf8;">Probar</button>
          </div>
        </div>

        <!-- Correo Electrónico -->
        <div class="card webhook-card" style="border-top: 3px solid #f59e0b; display: flex; flex-direction: column; justify-content: space-between; margin: 0;">
          <div>
            <div class="webhook-channel-header" style="margin-bottom: 14px; padding-bottom: 10px;">
              <div class="webhook-channel-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <span>Correo Electrónico</span>
                <span class="webhook-channel-badge badge-email">SMTP</span>
              </div>
              <label class="toggle-switch">
                <input type="checkbox" id="webhook-email-enable" onchange="Webhooks.toggleChannel('email', this.checked)">
                <span class="slider"></span>
              </label>
            </div>
            <div class="webhook-status-badge" id="webhook-email-status">
              <span class="status-dot"></span> <span id="webhook-email-status-text">Sin configurar</span>
            </div>
          </div>
          <div style="display: flex; gap: 8px; margin-top: 18px;">
            <button type="button" class="btn btn-primary" onclick="Webhooks.openModal('email')" style="flex: 1; font-size: 0.82rem; padding: 7px 12px;">Configurar</button>
            <button type="button" class="btn btn-outline" id="btn-test-email" onclick="Webhooks.testChannel('email')" style="font-size: 0.82rem; padding: 7px 14px; border-color: rgba(245, 158, 11, 0.4); color: #fbbf24;">Probar</button>
          </div>
        </div>

      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-outline" onclick="Webhooks.closeChannelsModal()">Cerrar</button>
    </div>
  </div>
</div>

<!-- Tarjeta Principal: Eventos Desencadenantes -->
<div class="card">
  <div class="card-title" style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e3b341" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    <span>Eventos Desencadenantes de Notificación</span>
  </div>

  <div class="events-checkbox-grid">
    <label class="event-checkbox-card" for="webhook-event-start">
      <div class="event-card-info">
        <div class="event-label-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#3fb950"><circle cx="12" cy="12" r="10"/></svg>
          <span>Servidor 100% Online</span>
        </div>
      </div>
      <span class="toggle-switch">
        <input type="checkbox" id="webhook-event-start" checked>
        <span class="slider"></span>
      </span>
    </label>

    <label class="event-checkbox-card" for="webhook-event-starting">
      <div class="event-card-info">
        <div class="event-label-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f0883e" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Inicio de Arranque</span>
        </div>
      </div>
      <span class="toggle-switch">
        <input type="checkbox" id="webhook-event-starting" checked>
        <span class="slider"></span>
      </span>
    </label>

    <label class="event-checkbox-card" for="webhook-event-stop">
      <div class="event-card-info">
        <div class="event-label-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#8b949e"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          <span>Detención Normal</span>
        </div>
      </div>
      <span class="toggle-switch">
        <input type="checkbox" id="webhook-event-stop" checked>
        <span class="slider"></span>
      </span>
    </label>

    <label class="event-checkbox-card" for="webhook-event-crash">
      <div class="event-card-info">
        <div class="event-label-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f85149" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Caída Inesperada (Crash)</span>
        </div>
      </div>
      <span class="toggle-switch">
        <input type="checkbox" id="webhook-event-crash" checked>
        <span class="slider"></span>
      </span>
    </label>

    <label class="event-checkbox-card" for="webhook-event-backup">
      <div class="event-card-info">
        <div class="event-label-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
          <span>Respaldo Creado</span>
        </div>
      </div>
      <span class="toggle-switch">
        <input type="checkbox" id="webhook-event-backup" checked>
        <span class="slider"></span>
      </span>
    </label>

    <label class="event-checkbox-card" for="webhook-event-save">
      <div class="event-card-info">
        <div class="event-label-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d29922" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
          <span>Guardado del Mundo</span>
        </div>
      </div>
      <span class="toggle-switch">
        <input type="checkbox" id="webhook-event-save" checked>
        <span class="slider"></span>
      </span>
    </label>

    <label class="event-checkbox-card" for="webhook-event-restart">
      <div class="event-card-info">
        <div class="event-label-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#bc8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
          <span>Reinicio Programado</span>
        </div>
      </div>
      <span class="toggle-switch">
        <input type="checkbox" id="webhook-event-restart" checked>
        <span class="slider"></span>
      </span>
    </label>

    <label class="event-checkbox-card" for="webhook-event-shutdown-warn">
      <div class="event-card-info">
        <div class="event-label-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e3b341" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Aviso de Apagado por Horario</span>
        </div>
      </div>
      <span class="toggle-switch">
        <input type="checkbox" id="webhook-event-shutdown-warn" checked>
        <span class="slider"></span>
      </span>
    </label>

    <label class="event-checkbox-card" for="webhook-event-player">
      <div class="event-card-info">
        <div class="event-label-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#79c0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Superviviente se Conecta</span>
        </div>
      </div>
      <span class="toggle-switch">
        <input type="checkbox" id="webhook-event-player">
        <span class="slider"></span>
      </span>
    </label>

    <label class="event-checkbox-card" for="webhook-event-player-leave">
      <div class="event-card-info">
        <div class="event-label-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Superviviente se Desconecta</span>
        </div>
      </div>
      <span class="toggle-switch">
        <input type="checkbox" id="webhook-event-player-leave">
        <span class="slider"></span>
      </span>
    </label>
  </div>
</div>

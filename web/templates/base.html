<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>{% block title %}PZ Server Manager — Panel para Project Zomboid Dedicated Server{% endblock %}</title>
  <meta name="description" content="Panel de control web para servidores dedicados de Project Zomboid en Docker (Steam / No-Steam).">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <link rel="apple-touch-icon" href="/static/img/logo.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1b1e23">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PZ Server Manager">

  <!-- Chart.js para monitoreo en tiempo real -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

  <!-- Estilos base + Workbench Redesign (Dockraft) -->
  <link rel="stylesheet" href="/static/css/style.css?v={{ panel_version | default('0.3.0') }}&_t={{ asset_v | default('1') }}">
  <link rel="stylesheet" href="/static/css/redesign.css?v={{ panel_version | default('0.3.0') }}&_t={{ asset_v | default('1') }}">
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

  {% block content %}{% endblock %}

  <!-- Toast Notification System -->
  <div id="toast-container" class="toast-container" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;max-width:340px;"></div>

  {% block scripts %}{% endblock %}
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').then(reg => reg.update()).catch(() => {});
      });
    }
  </script>

</body>
</html>

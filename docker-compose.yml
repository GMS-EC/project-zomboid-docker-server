---
name: pz-server
services:
  pz-server:
    image: pz-server-docker:latest
    build: .
    platform: linux/amd64
    restart: unless-stopped
    container_name: pz-server
    stop_grace_period: 45s
    mem_limit: ${MEM_LIMIT:-7g}       # Dejar margen sobre el heap JVM (-Xmx)
    ports:
      - "16261:16261/udp"            # Puerto principal de juego PZ
      - "16262:16262/udp"            # Conexión directa / Steam query
      - "8580:8080"                  # Panel web
    environment:
      # Solo infraestructura; los ajustes del juego se configuran desde el panel web.
      - TZ=${TZ:-America/Guayaquil}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PANEL_USER=${PANEL_USER:-admin}
      - PANEL_PASSWORD=${PANEL_PASSWORD:-adminpassword}
    volumes:
      - ./steamcmd/pz:/home/steam/steamcmd/pz   # Binarios del servidor (AppID 380870)
      - ./pz-data:/home/steam/Zomboid           # Datos del mundo, .ini, db y logs
      - ./pz-backups:/home/steam/pz-backups     # Respaldos
      - ./pz-config:/app/data                   # Configuración persistente del panel
    labels:
      icon: https://projectzomboid.com/favicon.ico
